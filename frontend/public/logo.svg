<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="ppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="18" fill="#0f172a" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="17" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Animated-style Realtime Pulse Waveform & Bar Chart Graphic -->
  <!-- Bar 1 -->
  <rect x="15" y="32" width="6" height="18" rx="3" fill="#94a3b8" opacity="0.6" />
  
  <!-- Bar 2 (tallest, primary) -->
  <rect x="25" y="18" width="6" height="32" rx="3" fill="url(#ppGrad)" />
  
  <!-- Bar 3 -->
  <rect x="35" y="24" width="6" height="26" rx="3" fill="url(#glowGrad)" />

  <!-- Live Pulse Dot & Ring -->
  <circle cx="49" cy="20" r="4.5" fill="#10b981" />
  <circle cx="49" cy="20" r="7.5" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
</svg>
