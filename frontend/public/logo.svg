<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="liveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep dark backdrop -->
  <rect width="64" height="64" rx="16" fill="#111827" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Animated-feel Soundwave / Histogram bars with Neon Styling -->
  <rect x="14" y="34" width="6" height="16" rx="3" fill="#06b6d4" opacity="0.8" />
  <rect x="24" y="20" width="6" height="30" rx="3" fill="url(#liveGradient)" filter="url(#glow)" />
  <rect x="34" y="14" width="6" height="36" rx="3" fill="#8b5cf6" />
  <rect x="44" y="28" width="6" height="22" rx="3" fill="#ec4899" opacity="0.85" />

  <!-- Top-right Pulse Beacon -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" />
  <circle cx="50" cy="14" r="6" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
</svg>
